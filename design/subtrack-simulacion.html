<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SubTrack · Simulación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  SubTrack · simulación navegable (versión final para Claude Code)
  ----------------------------------------------------------------
  Archivo independiente: no necesita support.js ni ningún build. Ábrelo en el navegador.
  Referencia de pantallas, componentes, colores y textos: subtrack-pantallas.md (misma carpeta).

  Fuente de datos en la app real:
   - 02 Login/registro: backend real (AuthService). Aquí se simula la respuesta.
   - 07, 08, 09, 13 (dashboard, lista, detalle, agregar/editar): backend real (fase de Claude Code).
   - 04, 05 (escaneo y resultados): DATOS DE EJEMPLO, provisionales.
   - El resto (avisos, ahorro, guía): datos de ejemplo hasta que exista su endpoint.
  "Hoy" en la simulación es el 17 sep 2026.
-->
<style>
:root{
  --page:#080D18; --bg:#0B1220; --surface:#141D2F; --surface-2:#16273F; --surface-3:#1C2942; --bar:#0E1626;
  --line:#243149; --line-2:#2C3B58; --divider:#1E2A40;
  --text:#E9EFFA; --text-2:#D6E3FB; --muted:#9AAAC4; --muted-hero:#A6B6D0;
  --primary:#2563EB; --accent:#60A5FA; --link:#7DB3FF; --accent-soft:#A9CCFF;
  --amber:#FBD167; --amber-strong:#FCD34D; --amber-line:rgba(251,191,36,.45); --amber-bg:rgba(251,191,36,.13);
  --error:#F87171; --error-soft:#FCA5A5; --error-bg:rgba(248,113,113,.12); --error-line:rgba(248,113,113,.45);
  --hero:linear-gradient(140deg,#0D1526 0%,#152443 55%,#1E3A6E 100%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--page)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.35;color:var(--text)}
button,input,select{font-family:inherit}
button{cursor:pointer}
p{margin:0}
@keyframes st-in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes st-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes st-scan{0%{transform:scale(.92);opacity:.35}50%{transform:scale(1.04);opacity:1}100%{transform:scale(.92);opacity:.35}}
@keyframes st-bar{from{width:6%}to{width:100%}}
@keyframes st-spin{to{transform:rotate(360deg)}}

.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 64px;gap:14px}
.top{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:#C7D4EA;font-size:12.5px}
.top b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.top .dim{opacity:.72}

/* Teléfono */
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:38px;overflow:hidden;overflow:clip;position:relative;display:flex;flex-direction:column;box-shadow:0 26px 64px rgba(10,14,25,.34);isolation:isolate}
.orb{position:absolute;border-radius:50%;z-index:1;pointer-events:none}
.orb.a{top:-74px;right:-44px;width:206px;height:206px;background:radial-gradient(circle at 40% 40%,rgba(59,130,246,.45),transparent 70%)}
.orb.b{top:104px;left:-84px;width:210px;height:210px;background:radial-gradient(circle at 50% 50%,rgba(37,99,235,.38),transparent 70%)}
.status{display:flex;justify-content:space-between;align-items:center;padding:15px 26px 4px;font-size:12.5px;font-weight:700;color:#F2F6FD;position:relative;z-index:4}
.status span:last-child{display:flex;gap:5px;align-items:center;opacity:.9}
.screen{flex:1;display:flex;flex-direction:column;position:relative;z-index:3;min-height:0}
.screen.pad{padding:26px 24px 24px;overflow-y:auto}
.screen.clip{overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:14px}
.footer{padding:12px 16px 20px;border-top:1px solid var(--divider);background:var(--bar);display:flex;flex-direction:column;gap:9px}

/* Marca */
.brand{font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;background:var(--primary);color:#fff;font-size:13px;font-weight:900;flex:none}
.brand.sm{font-size:16.5px}.brand.sm .mark{width:26px;height:26px;font-size:12px}

/* Encabezado con degradado */
.hero{background:var(--hero);border-radius:0 0 26px 26px;padding:10px 16px 20px;position:relative}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--muted-hero);letter-spacing:.09em;text-transform:uppercase}
.h-title{font-size:21px;font-weight:800;letter-spacing:-.025em}
.h-sub{font-size:12.5px;color:var(--muted-hero);font-weight:600}
.big{font-size:38px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.05}
.glass{padding:16px 16px 15px;border-radius:22px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.36);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px rgba(0,0,0,.16);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-3);color:#CFE0FF;border:1px solid var(--line-2)}
.avatar.lg{width:52px;height:52px;font-size:17px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;padding:14px 18px;border-radius:999px;border:0;width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary[disabled]{opacity:.6;cursor:default}
.btn-outline{background:transparent;color:var(--text-2);border:1px solid var(--line-2);font-size:13.5px;padding:13px}
.btn-dashed{background:transparent;color:var(--text-2);border:1px dashed var(--line-2);font-size:13.5px;padding:13px}
.btn-amber{background:transparent;color:var(--amber);border:1.5px solid var(--amber-line);font-size:13.5px;padding:13px}
.btn-ghost{background:transparent;color:var(--muted);font-size:13px;padding:10px}
.btn-link{background:transparent;color:var(--link);font-size:13px;padding:8px}
.btn-danger{background:#DC2626;color:#fff}
.btn-danger-text{background:transparent;color:var(--error);font-size:13px;padding:10px}
.btn-sm{width:auto;font-size:12.5px;padding:8px 13px;gap:5px}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text-2);border:1px solid rgba(255,255,255,.22)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:st-spin .7s linear infinite}

/* Formularios */
.label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}
.input{width:100%;font-size:14.5px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;color-scheme:dark}
.input::placeholder{color:rgba(154,170,196,.6)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.input.has-err{border-color:var(--error)}
.field{display:block}
.field-err{margin:6px 2px 0;font-size:12px;font-weight:600;color:var(--error)}
.form{display:flex;flex-direction:column;gap:14px}
.banner-err{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:600;padding:12px 13px;border-radius:12px;background:var(--error-bg);color:var(--error-soft);border:1px solid var(--error-line);line-height:1.45}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card.flag{background:#17203A;border:2px solid rgba(251,191,36,.55)}
.list{display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;gap:12px}
.grow{min-width:0;flex:1}
.name{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.meta{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
.amount{display:block;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.per{font-size:11.5px;color:var(--muted);font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.when{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.logo{border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;letter-spacing:-.02em}
.flagchip{margin:12px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px}
.flagchip.amber{background:var(--amber-bg);color:var(--amber);border:1.5px dashed rgba(251,191,36,.55)}
.flagchip.blue{background:var(--surface-2);color:var(--accent-soft);border:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px}
.chip.amber{background:rgba(251,191,36,.14);color:var(--amber-strong);border:1px solid rgba(251,191,36,.42)}
.chip.neutral{background:#1A263D;color:var(--text-2);border:1px solid var(--line-2)}
.provisional{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:var(--amber-bg);color:var(--amber);border:1.5px dashed rgba(251,191,36,.55)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px;padding:0 2px}
.sec-h h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.count{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--primary);color:#fff}
.sec-note{font-size:12px;color:var(--muted);font-weight:600}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider)}
.fact:last-child{border-bottom:0}
.fact .k{font-size:12.5px;color:var(--muted);font-weight:600}
.fact .v{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.sub-h{margin:0 0 9px;padding:0 2px;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setting .t{display:block;font-size:13.5px;font-weight:700}
.setting .d{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.notice-amber{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:11px 13px;border-radius:12px;background:var(--amber-bg);color:var(--amber-strong);border:1.5px dashed rgba(251,191,36,.55)}
.notice-blue{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:700;padding:13px;border-radius:14px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-2);line-height:1.45}
.check{color:var(--accent);flex:none;margin-top:1px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 18px}
.empty .ico{width:54px;height:54px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--link)}

/* Selectores y switch */
.pills{display:flex;gap:8px}
.pill{flex:1;font-size:13px;font-weight:800;padding:11px 6px;border-radius:12px;background:transparent;color:var(--text-2);border:1px solid var(--line-2)}
.pill.on{background:var(--primary);color:#fff;border:0}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 14px}
.opt .l{font-size:15px;font-weight:800;letter-spacing:-.015em}
.opt .h{font-size:12px;color:var(--muted);font-weight:600}
.opt.on .h{color:#DCE6F8}
.switch{width:46px;height:27px;border-radius:99px;padding:3px;flex:none;border:1px solid var(--line-2);background:var(--surface);display:flex;justify-content:flex-start;align-items:center}
.switch.on{border:0;background:var(--primary);justify-content:flex-end}
.switch i{display:block;width:21px;height:21px;border-radius:50%;background:#5B6A85}
.switch.on i{background:#fff}
.dots{display:flex;gap:7px;margin-bottom:22px}
.dots span{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:width .2s}
.dots span.on{width:22px;background:var(--accent)}

/* Barra de pestañas */
.tabs{display:flex;justify-content:space-around;padding:11px 6px 20px;background:var(--bar);border-top:1px solid var(--divider);position:relative;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;background:transparent;border:0;padding:2px 4px;color:var(--muted)}
.tab.on{color:var(--link)}

/* Superposiciones */
.push{position:absolute;top:44px;left:12px;right:12px;z-index:20;text-align:left;animation:st-in .28s ease-out;padding:13px 14px;border-radius:20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.36);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px rgba(0,0,0,.36);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:#F2F6FD;display:flex;gap:11px;align-items:flex-start}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:25;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 12px 26px rgba(0,0,0,.36);font-size:13px;font-weight:600;color:var(--text);animation:st-up .22s ease-out}
.toast.low{bottom:24px}
.scrim{position:absolute;inset:0;z-index:30;background:rgba(5,9,18,.72);display:flex;align-items:flex-end;padding:12px}
.sheet{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:10px;animation:st-up .22s ease-out}
.sheet .t{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sheet .b{font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.5;margin-bottom:6px}

/* Controles de la simulación */
.sim{width:390px;max-width:100%;background:var(--bg);border:1px solid var(--divider);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:11px}
.sim .btns{display:flex;flex-wrap:wrap;gap:8px}
.sim button{font-size:12px;font-weight:700;padding:9px 13px;border-radius:999px;background:transparent;color:var(--text-2);border:1px solid var(--line-2)}
.sim button.warn{color:var(--amber);border:1.5px solid var(--amber-line)}
.sim select{width:100%;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color-scheme:dark}
.sim .note{font-size:11.5px;color:#C7D4EA;opacity:.7;line-height:1.55}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <span><b>SubTrack · simulación navegable</b><span class="dim">Flat + acentos glass · azul oscuro · MVP v1</span></span>
    <span class="dim" id="screenName"></span>
  </div>
  <div class="phone" id="phone"></div>
  <div class="sim" id="sim"></div>
</div>

<script>
/* ---------- Utilidades ---------- */
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const HOY = new Date(2026, 8, 17); // 17 sep 2026
const money = n => '$' + Math.round(n).toLocaleString('es-CO');
const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const daysTo = s => Math.round((parse(s) - HOY) / 864e5);
const dm = s => { const d = parse(s); return d.getDate() + ' ' + MES[d.getMonth()]; };
const dmy = s => dm(s) + ' ' + parse(s).getFullYear();
const mesAnio = s => { const d = parse(s); return MES[d.getMonth()] + ' ' + d.getFullYear(); };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0] || '')[0] + ((p[1] || '')[0] || (p[0] || '')[1] || '')).toUpperCase(); };
const subIni = n => { const t = String(n).trim(); return t.length <= 2 ? t : t.slice(0, 2); };
const perLabel = f => f === 'anual' ? '/año' : f === 'semanal' ? '/semana' : '/mes';
const freqName = f => f.charAt(0).toUpperCase() + f.slice(1);
const monthly = s => s.es_prueba ? 0 : (s.frecuencia === 'anual' ? s.monto / 12 : s.frecuencia === 'semanal' ? s.monto * 4.33 : s.monto);
const monthlyAfterTrial = s => s.frecuencia === 'anual' ? s.monto / 12 : s.frecuencia === 'semanal' ? s.monto * 4.33 : s.monto;
const fechaClave = s => s.es_prueba && s.fecha_fin_prueba ? s.fecha_fin_prueba : s.fecha_proximo_cobro;

const ICON = {
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  alert: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2"/><circle cx="12" cy="16.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  cal: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
  next: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  back: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  edit: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  bell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9z"/><path d="M10 18.5a2.2 2.2 0 004 0"/></svg>',
  search: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="M16 16l4.5 4.5"/></svg>',
  plus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  tabHome: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>',
  tabList: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',

// Historial de pagos: hacia atrás desde el próximo cobro hasta la fecha "desde".
function historial(s) {
  if (s.es_prueba) return [];
  if (s.pagos) return s.pagos;
  const out = [];
  const d = parse(s.fecha_proximo_cobro);
  const start = parse(s.desde);
  for (let i = 0; i < 60; i++) {
    if (s.frecuencia === 'anual') d.setFullYear(d.getFullYear() - 1);
    else if (s.frecuencia === 'semanal') d.setDate(d.getDate() - 7);
    else d.setMonth(d.getMonth() - 1);
    if (d < start) break;
    const monto = (s.monto_anterior && out.length > 0) ? s.monto_anterior : s.monto;
    out.push({ fecha_pago: iso(d), monto });
  }
  return out;
}

function get(path) { const [a, b] = path.split('.'); return S[a][b]; }
function set(path, v) { const [a, b] = path.split('.'); S[a][b] = v; }

function decorate(s) {
  const dias = daysTo(fechaClave(s));
  const trial = !!s.es_prueba;
  const marked = s.estado === 'marcada_para_cancelar';
  const dueSoon = dias <= S.dias;
  let flag = null;
  if (marked) flag = { cls: 'amber', text: 'Marcada por ti para cancelar' };
  else if (trial) flag = { cls: 'amber', text: `Prueba gratis: se convierte en ${money(s.monto)}${perLabel(s.frecuencia)} en ${dias} día${dias === 1 ? '' : 's'}` };
  else if (s.monto_anterior) flag = { cls: 'blue', text: `Subió de ${money(s.monto_anterior)} a ${money(s.monto)} este mes` };
  else if (dueSoon) flag = { cls: 'blue', text: dias <= 0 ? 'Se cobra hoy' : dias === 1 ? 'Se cobra mañana' : `Se cobra en ${dias} días` };
  const nextLine = trial ? `Prueba termina ${dm(s.fecha_fin_prueba)}` : `Próximo cobro: ${dm(s.fecha_proximo_cobro)}`;
  const stateLine = marked ? `Marcada para cancelar · ${dm(fechaClave(s))}`
    : trial ? `Prueba gratis hasta ${dm(s.fecha_fin_prueba)}`
    : `${freqName(s.frecuencia)} · próximo ${dm(s.fecha_proximo_cobro)}`;
  return { s, dias, trial, marked, flag, nextLine, stateLine, cardFlag: trial || marked };
}

/* ---------- Navegación y acciones ---------- */
// Navegación con pila: goTo apila la pantalla actual; reset la vacía (pestañas, login, etc.).
function goTo(screen, reset) {
  if (scanTimer && screen !== 'scan') { clearTimeout(scanTimer); scanTimer = null; }
  if (reset) S.stack = [];
  else if (S.screen !== screen) S.stack.push(S.screen);
  show(screen);
}
function show(screen) {
  S.screen = screen; S.push = null; S.modal = null;
  render();
  const sc = document.querySelector('#phone .scroll, #phone .screen.pad'); if (sc) sc.scrollTop = 0;
}
function toast(msg) {
  S.toast = msg; render();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2400);
}
function openForm(id) {
  S.editId = id || null; S.formErr = {};
  if (id) {
    const s = S.subs.find(x => x.id === id);
    S.form = { nombre_servicio: s.nombre_servicio, categoria: s.categoria || '', monto: String(s.monto), frecuencia: s.frecuencia, fecha_proximo_cobro: s.fecha_proximo_cobro, es_prueba: !!s.es_prueba, fecha_fin_prueba: s.fecha_fin_prueba || '' };
  } else {
    S.form = blankForm();
  }
  goTo('agregar');
}
function validateAuth() {
  const a = S.auth, e = {}, up = S.authMode === 'signup';
  if (up && !a.nombre.trim()) e.nombre = 'Ingresa tu nombre';
  const c = a.correo.trim();
  if (!c) e.correo = 'Ingresa tu correo electrónico';
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) e.correo = 'Correo no válido';
  if (!a.password) e.password = 'Ingresa tu contraseña';
  else if (up && a.password.length < 6) e.password = 'Mínimo 6 caracteres';
  if (up && a.confirmar !== a.password) e.confirmar = 'Las contraseñas no coinciden';
  return e;
}
function validateSub() {
  const f = S.form, e = {};
  if (!f.nombre_servicio.trim()) e.nombre_servicio = 'Ingresa el nombre del servicio';
  if (!(Number(f.monto) > 0)) e.monto = 'Ingresa un monto mayor a 0';
  if (!f.fecha_proximo_cobro) e.fecha_proximo_cobro = 'Elige la fecha del próximo cobro';
  if (f.es_prueba && !f.fecha_fin_prueba) e.fecha_fin_prueba = 'Elige cuándo termina la prueba';
  return e;
}

const ACT = {
  go: k => goTo(k),
  tab: k => goTo(k, true),
  tabDash: () => goTo('dashboard', true),
  back: () => show(S.stack.pop() || 'dashboard'),
  open: id => { S.selected = id; goTo('detalle'); },
  add: () => openForm(null),
  edit: id => openForm(id),
  onbNext: () => { if (S.onb < 2) { S.onb++; render(); } else { S.authMode = 'signup'; S.authErr = {}; S.authServerErr = ''; goTo('auth'); } },
  toLogin: () => { S.authMode = 'login'; S.authErr = {}; S.authServerErr = ''; goTo('auth'); },
  toggleAuth: () => { S.authMode = S.authMode === 'signup' ? 'login' : 'signup'; S.authErr = {}; S.authServerErr = ''; render(); },
  submitAuth: () => {
    S.authServerErr = '';
    S.authErr = validateAuth();
    if (Object.keys(S.authErr).length) return render();
    S.authLoading = true; render();
    setTimeout(() => {
      S.authLoading = false;
      const up = S.authMode === 'signup', correo = S.auth.correo.trim().toLowerCase();
      if (!up && S.auth.password === 'incorrecta') { S.authServerErr = 'Correo o contraseña incorrectos'; return render(); }
      if (up && correo === 'existe@correo.com') { S.authServerErr = 'Ya existe una cuenta con ese correo'; return render(); }
      if (up) S.user = { nombre: S.auth.nombre.trim(), correo };
      else S.user = { nombre: S.user.nombre, correo };
      S.auth = { nombre: '', correo: '', password: '', confirmar: '' };
      goTo(up ? 'permisos' : 'dashboard', 'dashboard');
      toast('Hola, ' + S.user.nombre.split(' ')[0]);
    }, 900);
  },
  grantPerms: () => { S.perms = true; goTo('scan'); scanTimer = setTimeout(() => { scanTimer = null; if (S.screen === 'scan') goTo('resultados'); }, 1900); },
  denyPerms: () => { S.perms = false; S.form = blankForm(); S.editId = null; S.formErr = {}; goTo('agregar'); },
  togglePerms: () => { S.perms = !S.perms; render(); },
  togglePick: id => { S.picked = S.picked.includes(id) ? S.picked.filter(x => x !== id) : S.picked.concat(id); render(); },
  setDias: v => { S.dias = Number(v); render(); },
  setPerSub: v => { S.perSub[S.selected] = Number(v); render(); },
  toggleResumen: () => { S.resumen = !S.resumen; render(); },
  finishOnboarding: () => goTo('dashboard', 'dashboard'),
  toggleMark: () => { const s = sel(); s.estado = s.estado === 'marcada_para_cancelar' ? 'activa' : 'marcada_para_cancelar'; render(); },
  confirmCancel: () => {
    const s = sel();
    s.estado = 'cancelada';
    S.cancelled.unshift({ ini: s.ini, nombre_servicio: s.nombre_servicio, color: s.color, fecha_cancelacion: iso(HOY), ahorro_proyectado_anual: Math.round(monthlyAfterTrial(s) * 12) });
    S.justCancelled = s.nombre_servicio;
    goTo('ahorro', 'dashboard');
  },
  setFreq: f => { S.form.frecuencia = f; render(); },
  toggleTrial: () => { S.form.es_prueba = !S.form.es_prueba; delete S.formErr.fecha_fin_prueba; render(); },
  saveSub: () => {
    S.formErr = validateSub();
    if (Object.keys(S.formErr).length) return render();
    const f = S.form;
    const data = { nombre_servicio: f.nombre_servicio.trim(), categoria: f.categoria.trim(), monto: Number(f.monto), frecuencia: f.frecuencia, fecha_proximo_cobro: f.fecha_proximo_cobro, es_prueba: f.es_prueba, fecha_fin_prueba: f.es_prueba ? f.fecha_fin_prueba : null };
    if (S.editId) {
      const s = S.subs.find(x => x.id === S.editId);
      if (s.monto !== data.monto) delete s.monto_anterior;
      if (s.nombre_servicio !== data.nombre_servicio) delete s.ini;
      Object.assign(s, data);
      S.editId = null;
      ACT.back();
      toast('Cambios guardados');
    } else {
      const id = 'u' + Date.now();
      S.subs.push(Object.assign({ id, color: PALETA_MANUAL, desde: iso(HOY), origen: 'manual', estado: 'activa', pagos: [] }, data));
      // En el onboarding (rechazó permisos) sigue a la preferencia de recordatorio; si no, vuelve a donde estaba.
      if (S.stack[S.stack.length - 1] === 'permisos') goTo('prefs'); else ACT.back();
      toast(data.nombre_servicio + ' se agregó a tu lista');
    }
  },
  askDelete: () => { const s = S.subs.find(x => x.id === S.editId); S.modal = { t: `¿Eliminar ${s.nombre_servicio}?`, b: 'Se borra de tu lista junto con su historial de pagos y sus recordatorios. Esto no cancela el servicio con el proveedor y no se puede deshacer.', cta: 'Eliminar suscripción', act: 'doDelete' }; render(); },
  doDelete: () => { const name = S.subs.find(x => x.id === S.editId).nombre_servicio; S.subs = S.subs.filter(x => x.id !== S.editId); S.editId = null; S.selected = null; goTo('dashboard', 'dashboard'); toast(name + ' se eliminó de tu lista'); },
  askDeleteAccount: () => { S.modal = { t: '¿Eliminar tu cuenta?', b: 'Borramos tu cuenta, tus suscripciones, el historial y los recordatorios. Esto no se puede deshacer.', cta: 'Eliminar cuenta y datos', act: 'doDeleteAccount' }; render(); },
  doDeleteAccount: () => { S = initialState(); S.authMode = 'signup'; goTo('welcome'); },
  logout: () => { S.authMode = 'login'; S.authErr = {}; S.authServerErr = ''; goTo('auth', 'dashboard'); },
  closeModal: () => { S.modal = null; render(); },
  openPush: () => { const id = S.push.id; S.push = null; ACT.open(id); },
  simPush: kind => {
    const map = {
      cobro: { id: 'nf', t: 'Netflix se cobra en 3 días', b: `${money(38900)} el 20 de septiembre. Si ya no la quieres, este es el momento.` },
      prueba: { id: 'gf', t: 'Tu prueba de GeForce NOW termina en 2 días', b: `El 19 de septiembre pasa a ${money(89900)}/mes.` },
      precio: { id: 'ps', t: 'Adobe Photoshop subió de precio', b: `De ${money(41900)} a ${money(47900)}/mes desde este cobro.` },
      deteccion: { id: 'sf', t: '¿Tienes una suscripción a Smart Fit?', b: `Detectamos 3 cobros de ${money(89900)} con la misma periodicidad.` }
    };
    const p = map[kind];
    if (!S.subs.some(s => s.id === p.id && s.estado !== 'cancelada')) return toast('Esa suscripción ya no está en la lista');
    S.push = p; render();
  },
  simEmpty: () => { S.subs = []; S.selected = null; goTo('dashboard', 'dashboard'); },
  reset: () => { clearTimeout(scanTimer); S = initialState(); render(); }
};

/* ---------- Eventos (delegados) ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && ev.target.closest('[data-stop]')) return;
  ev.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg);
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('[data-submit]');
  if (!f) return;
  ev.preventDefault();
  ACT[f.dataset.submit]();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.f) {
    set(el.dataset.f, el.value);
    const [group, key] = el.dataset.f.split('.');
    const errs = group === 'auth' ? S.authErr : S.formErr;
    if (errs[key]) {
      delete errs[key];
      el.classList.remove('has-err');
      const msg = el.parentElement.querySelector('.field-err'); if (msg) msg.remove();
    }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.sim === 'jump') {
    const k = ev.target.value;
    if ((k === 'detalle' || k === 'guia') && !sel()) return toast('No hay suscripciones para mostrar');
    if (k === 'detalle' || k === 'guia') S.selected = sel().id;
    if (k === 'agregar') return openForm(null);
    if (k === 'scan') return ACT.grantPerms();
    goTo(k, TAB_SCREENS.includes(k) ? k : 'dashboard');
  }
});

render();
</script>
</body>
</html>
